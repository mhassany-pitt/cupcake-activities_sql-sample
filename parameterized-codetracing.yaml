$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parameterized-code-tracing/0.1.0
source: main.sql
includes:
  - seed.sql
license: MIT
locale: en-US
id: parameterized_code_tracing_bank_account
title: Trace SQL Bank Account Table State Transitions
description: Trace the tabular result set of the accounts table as deposit amounts and withdrawal amounts vary.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parameterized-code-tracing
  difficulty: novice
  prereq_topics:
    - relational-databases
    - sql-basics
  topics:
    - sql
    - dml
    - updates
    - filtering
    - queries
    - state-tracing
runtime:
  language: sql
  version: 2016
statement: |
  Determine the exact tabular **output** of the SQL execution.
  The script initializes the `accounts` table with a starting balance and executes a sequence of `UPDATE` and `SELECT` statements.
testcases:
  - title: Standard Trace Execution
    visible: true
    stdin: []
    stdout: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    console: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    status: pass
    hints:
      - "Trace the parameter values step-by-step through each statement."
      - "Check if the withdrawal amount exceeds the balance to determine which branch executes."
    feedback:
      - on_pass:
          - explanations:
              - "Correct trace! You tracked the state transitions and outputs accurately."
        on_fail:
          - explanations:
              - "Your trace output did not match. Trace each parameter update carefully."
elements:
  - type: parameter
    location:
      context: UPDATE accounts SET balance = balance + 100 WHERE id = 1;
      snippet: '100'
    values:
      - 50
      - 100
      - 200
  - type: parameter
    location:
      context: UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;
      snippet: '50'
      nth: 1
    values:
      - 25
      - 50
      - 75
