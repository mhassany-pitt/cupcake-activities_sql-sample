$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: main.sql
includes:
  - seed.sql
license: MIT
locale: en-US
id: free_coding_bank_account
title: Bank Account Management in SQL
description: Write and execute SQL DML and query statements to deposit funds, safely withdraw funds, and retrieve ordered balances.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
    - relational-databases
    - sql-basics
  topics:
    - sql
    - dml
    - updates
    - filtering
    - queries
runtime:
  language: sql
  version: 2016
statement: |
  Write SQL statements to perform transactions on the seeded `accounts` table:
  1. Deposit `100` into Bob's account (`id = 1`).
  2. Withdraw `50` from Bob's account (`id = 1`) only if his balance is at least `50` (`balance >= 50`).
  3. Query all columns `id`, `owner`, and `balance` from `accounts` ordered by `id ASC`.
hints:
  - "Review the problem statement and ensure the steps are executed in order."
  - "Verify that initial values, deposits, withdrawals, and prints match the specification."
elements:
  - type: editable
    location:
      snippet: |-
        UPDATE accounts SET balance = balance + 100 WHERE id = 1;

        -- Withdraw 50 from Bob's account if balance is sufficient
        UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;

        -- Query final account balances
        SELECT id, owner, balance FROM accounts ORDER BY id ASC;
    placeholder: |-
      -- 1. Deposit 100 into Bob's account (id = 1)
      -- 2. Withdraw 50 from Bob's account if balance >= 50
      -- 3. Query id, owner, balance from accounts ordered by id ASC
testcases:
  - title: Standard Account Workflow
    visible: true
    stdin: []
    stdout: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    console: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    status: pass
    feedback:
      on_pass:
        - "Great job! Your solution executed properly and matched all expected outputs."
      on_fail:
        - "Your code produced differing output. Double-check your method calls and printed formatting."
