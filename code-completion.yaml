$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/code-completion/0.1.0
source: main.sql
includes:
  - seed.sql
license: MIT
locale: en-US
id: cc_bank_account
title: Complete the BankAccount SQL Implementation
description: Fill in essential SQL keywords, operators, and relational predicates to update and query bank account tables.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics:
    - relational-databases
    - sql-basics
  topics:
    - sql
    - dml
    - updates
    - filtering
    - queries
runtime:
  language: sql
  version: 2016
statement: |
  Complete the `accounts` SQL transaction queries by selecting the correct keywords, arithmetic operators, and relational predicates.
  Make sure to:
  1. Use the `UPDATE` statement to modify existing table rows.
  2. Increase the balance during a deposit transaction.
  3. Ensure that withdrawal amounts do not exceed the available balance.
  4. Query the final table results using `SELECT`.
testcases:
  - title: Bob's Account
    visible: true
    stdin: []
    stdout: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    console: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    status: pass
    hints:
      - "Review the blanks and ensure the operations match the expected transaction flow."
      - "Pay attention to conditional checks and return or print statements."
    feedback:
      - on_pass:
          - explanations:
              - "Great job! All blanks were completed correctly and produced the expected output."
        on_fail:
          - explanations:
              - "One or more blanks are incorrect. Check the expected output and verify your selections."
elements:
  - type: blank
    location:
      context: UPDATE accounts SET balance = balance + 100 WHERE id = 1;
      snippet: UPDATE
      nth: 1
    choices:
      - snippet: UPDATE
        role: solution
        explanations:
          - body: |
              Correct! In SQL, the `UPDATE` statement is used to modify existing row values in a relational table.
      - snippet: INSERT
        role: distractor
        explanations:
          - body: |
              Incorrect. `INSERT` is used to add new rows to a table, not to update existing balances.
      - snippet: ALTER
        role: distractor
        explanations:
          - body: |
              Incorrect. `ALTER` is a DDL command used to modify table schemas (e.g. adding columns), not row values.
      - snippet: SELECT
        role: distractor
        explanations:
          - body: |
              Incorrect. `SELECT` is used to query data, not to mutate column values.
  - type: blank
    location:
      context: UPDATE accounts SET balance = balance + 100 WHERE id = 1;
      snippet: +
      nth: 1
    choices:
      - snippet: +
        role: solution
        explanations:
          - body: |
              Correct! The `+` operator increases the current balance by the deposit amount.
      - snippet: '-'
        role: distractor
        explanations:
          - body: |
              Incorrect. The `-` operator would subtract funds from the account instead of depositing them.
      - snippet: '*'
        role: distractor
        explanations:
          - body: |
              Incorrect. The `*` operator would multiply the current balance by 100 instead of adding funds.
      - snippet: /
        role: distractor
        explanations:
          - body: |
              Incorrect. The `/` operator would divide the balance instead of crediting it.
  - type: blank
    location:
      context: UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;
      snippet: '>='
      nth: 1
    choices:
      - snippet: '>='
        role: solution
        explanations:
          - body: |
              Correct! The greater-than-or-equal operator (`>=`) ensures the withdrawal only occurs if the account has at least 50 in funds.
      - snippet: <=
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `<=` would permit withdrawals only when the balance is 50 or less, risking an overdraft if balance is under 50.
      - snippet: '='
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `=` would only allow withdrawals if the balance is exactly equal to 50, rejecting withdrawals when balance is greater than 50.
      - snippet: <
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `<` would permit withdrawals only when funds are strictly less than 50, guaranteeing an overdraft into negative balance!
  - type: blank
    location:
      context: SELECT id, owner, balance FROM accounts ORDER BY id ASC;
      snippet: SELECT
      nth: 1
    choices:
      - snippet: SELECT
        role: solution
        explanations:
          - body: |
              Correct! The `SELECT` command queries and returns the specified column values from the `accounts` table.
      - snippet: FETCH
        role: distractor
        explanations:
          - body: |
              Incorrect. In standard SQL queries, queries start with `SELECT`, not `FETCH`.
      - snippet: GET
        role: distractor
        explanations:
          - body: |
              Incorrect. `GET` is not a standard SQL DML keyword for querying table rows.
      - snippet: SHOW
        role: distractor
        explanations:
          - body: |
              Incorrect. `SHOW` is used in some database engines for inspecting schema metadata, not for tabular data projection.
