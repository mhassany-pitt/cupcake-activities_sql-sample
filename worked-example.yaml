statement: |
  This worked example demonstrates how `accounts` relational table state is managed using Standard SQL. We'll examine:
  1. Table schema creation (`CREATE TABLE`)
  2. Data insertion (`INSERT INTO`)
  3. Deposit and withdrawal transaction updates (`UPDATE ... SET`)
  4. Querying results (`SELECT`)
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      id  owner  balance
      --  -----  -------
      1   Bob    250    
      2   Alice  500
    console: |-
      id  owner  balance
      --  -----  -------
      1   Bob    250    
      2   Alice  500
    status: pass
elements:
  - type: explanation
    location:
      snippet: "CREATE TABLE accounts ("
    explanations:
      - body: |
          The `CREATE TABLE` statement defines the relational structure:
          ```sql
          CREATE TABLE accounts (
              id INTEGER PRIMARY KEY,
              owner TEXT NOT NULL,
              balance INTEGER NOT NULL
          );
          ```
          Every record has a primary key `id`, an `owner` string, and an integer `balance`.
      - body: |
          ...
  - type: explanation
    location:
      snippet: "UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;"
    explanations:
      - body: |
          This `UPDATE` query performs a safe withdrawal: the `WHERE` clause requires both `id = 1` and `balance >= 50` so that an account with insufficient funds is never debited into a negative balance.
