id: we_bank_account
title: Bank Account Management
description: Learn how to manage relational bank account tables, updates, and queries using Standard SQL.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics:
    - databases
    - sql
    - dml
runtime:
  language: sql
statement: |
  This worked example demonstrates how `accounts` relational table state is managed using Standard SQL. We'll examine:
  1. Deposit and withdrawal transaction updates (`UPDATE ... SET`)
  2. Querying results (`SELECT`)
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    console: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    status: pass
elements:
  - type: explanation
    location:
      snippet: "UPDATE accounts SET balance = balance + 100 WHERE id = 1;"
    explanations:
      - body: |
          This `UPDATE` statement credits Bob's account (id = 1) by adding 100 to the current balance.
  - type: explanation
    location:
      snippet: "UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;"
    explanations:
      - body: |
          This `UPDATE` query performs a safe withdrawal: the `WHERE` clause requires both `id = 1` and `balance >= 50` so that an account with insufficient funds is never debited into a negative balance.
