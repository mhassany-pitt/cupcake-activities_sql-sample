statement: |
  This worked example demonstrates how `accounts` relational table state is managed using Standard SQL. We'll examine:
  1. Crediting funds using `UPDATE accounts SET balance = balance + ... WHERE id = ...`.
  2. Safe debiting with overdraft protection using compound `WHERE ... AND balance >= ...` conditions.
  3. Querying and ordering the resulting account rows with `SELECT ... ORDER BY id ASC`.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    console: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    status: pass
    feedback:
      - on_pass:
          - explanations:
              - "Demonstrates the step-by-step execution and final state of the bank account transactions."
elements:
  - type: explanation
    location:
      snippet: UPDATE accounts SET balance = balance + 100 WHERE id = 1;
    explanations:
      - body: |
          ### 1. The Deposit `UPDATE` Query
          * `UPDATE accounts`: Specifies the target table to modify.
          * `SET balance = balance + 100`: Increments the existing `balance` column value by `100`.
          * `WHERE id = 1`: Essential row filter ensuring only Bob's account (primary key `id = 1`) is updated. Omitting `WHERE` would update every row in the table!
  - type: explanation
    location:
      snippet: UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;
    explanations:
      - body: |
          ### 2. Safe Withdrawal with Compound Predicates
          * `SET balance = balance - 50`: Deducts 50 from the current balance.
          * `WHERE id = 1 AND balance >= 50`: Uses a compound `WHERE` clause with logical `AND`:
            1. `id = 1`: Targets Bob's account row.
            2. `balance >= 50`: Guarantees sufficient funds exist before executing the debit. If `balance < 50`, zero rows match the `WHERE` predicate, leaving the account balance unmodified and preventing overdrafts.
  - type: explanation
    location:
      snippet: SELECT id, owner, balance FROM accounts ORDER BY id ASC;
    explanations:
      - body: |
          ### 3. Querying Results
          * `SELECT id, owner, balance`: Explicitly projects the columns to return in the tabular result set.
          * `FROM accounts`: Sources data from the `accounts` table.
          * `ORDER BY id ASC`: Sorts the output rows deterministically in ascending order by primary key `id`.
