include_choices: 4
question: |
  Given the relational table `accounts(id, owner, balance)`:

  Which of the following SQL statements correctly withdraws `50` from Bob's account (`id = 1`) **only if** Bob has a balance of at least `50`?
choices:
  - body: |
      ```sql
      UPDATE accounts
      SET balance = balance - 50
      WHERE id = 1 AND balance >= 50;
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! The compound predicate `WHERE id = 1 AND balance >= 50` restricts the modification to Bob's row and only executes the debit if `balance >= 50`, preventing overdrafts.
  - body: |
      ```sql
      UPDATE accounts
      SET balance = balance - 50
      WHERE id = 1 OR balance >= 50;
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Using logical `OR` instead of `AND` matches row 1 OR any other account with `balance >= 50`. This would inadvertently debit 50 from **all accounts** in the system that have sufficient funds!
  - body: |
      ```sql
      UPDATE accounts
      SET balance = 50
      WHERE id = 1 AND balance >= 50;
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Assigning `SET balance = 50` hardcodes the account balance to 50 rather than deducting 50 from the current balance (`SET balance = balance - 50`).
  - body: |
      ```sql
      UPDATE accounts
      SET balance = balance - 50
      WHERE id = 1 AND balance <= 50;
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The condition `balance <= 50` inverts the logic: it only debits the account when funds are 50 or less, allowing users with low funds (e.g. 10) to be debited into a negative balance of -40 while blocking users with ample funds!
