$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parsons-puzzles/0.1.0
source: main.sql
includes:
  - seed.sql
license: MIT
locale: en-US
id: pp_bank_account
title: Bank Account Transaction Queries in SQL
description: Arrange the SQL queries to deposit funds, safely debit an account with balance validation, and project the ordered final balances.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - relational-databases
    - sql-basics
  topics:
    - sql
    - dml
    - updates
    - filtering
    - queries
runtime:
  language: sql
statement: |
  Rearrange the queries to correctly implement the deposit, safe withdrawal, and final balance query for the `accounts` table.
  Make sure to:
  1. Deposit funds into Bob's account (`id = 1`).
  2. Safely withdraw funds by enforcing `balance >= 50` in the `WHERE` predicate.
  3. Query the final table rows sorted by `id ASC`.
executions:
  - title: Standard Transaction
    stdout: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    console: |-
      id[int;pk],owner[text],balance[numeric]
      1,Bob,250
      2,Alice,500
    status: pass
elements:
  - type: block
    group: sql-queries
    location:
      snippet: UPDATE accounts SET balance = balance + 100 WHERE id = 1;
    choices:
      - snippet: UPDATE accounts SET balance = balance + 100 WHERE id = 1;
        role: solution
        explanations:
          - body: |
              Correct! Credits Bob's account (`id = 1`) by adding 100 to the current balance.
      - snippet: UPDATE accounts SET balance = balance + 100;
        role: distractor
        explanations:
          - body: |
              Incorrect. Omitting `WHERE id = 1` updates every single account in the database!
  - type: block
    group: sql-queries
    location:
      snippet: UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;
    choices:
      - snippet: UPDATE accounts SET balance = balance - 50 WHERE id = 1 AND balance >= 50;
        role: solution
        explanations:
          - body: |
              Correct! Debits 50 only if Bob's account has sufficient funds (`balance >= 50`).
      - snippet: UPDATE accounts SET balance = balance - 50 WHERE id = 1;
        role: distractor
        explanations:
          - body: |
              Incorrect. Lacking the `AND balance >= 50` condition allows withdrawals even when funds are insufficient, causing negative balances.
  - type: block
    group: sql-queries
    location:
      snippet: SELECT id, owner, balance FROM accounts ORDER BY id ASC;
    choices:
      - snippet: SELECT id, owner, balance FROM accounts ORDER BY id ASC;
        role: solution
        explanations:
          - body: |
              Correct! Selects `id`, `owner`, and `balance` ordered deterministically by primary key `id ASC`.
